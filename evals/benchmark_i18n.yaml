# German and Chinese versions of benchmark.yaml, keyed by question id.
#
# Same meaning, same gold SQL: only the question text changes. Station names, dates,
# "O'Connell Bridge" and "JCDecaux" stay as in the data, as a real user would type them.
# Machine-assisted translation. zh reviewed by a native speaker (2026-10-27); de is not
# reviewed by a native speaker (say so when citing de results).

